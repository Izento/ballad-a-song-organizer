[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballad-a-song-organizer"
version = "0.1.0"
description = "Review-first music library organizer"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47.0",
    "musicbrainzngs>=0.7.1",
    "pyacoustid>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
build = ["pyinstaller>=6.0.0"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
ballad = "ballad:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "release", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "RET", "PLR", "PLW"]
ignore = [
    "PLR0913", # Planners legitimately accept many keyword-only controls.
    "PLR2004", # Numeric layout values are clearer inline in Tk UI code.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-branches = 12

[tool.setuptools]
packages = [
    "ballad",
    "cli",
    "cli.commands",
    "gui",
    "renamer",
    "renamer.domain",
    "renamer.media",
    "renamer.media.adapters",
    "renamer.naming",
    "renamer.online",
    "renamer.planners",
    "renamer.transactions",
]

[tool.setuptools.package-dir]
ballad = "src/ballad"
